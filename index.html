<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Morcego Pixelado</title>

<style>
    body {
        margin: 0;
        background: #aaa;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #bat {
        display: grid;
        grid-template-columns: repeat(32, 8px);
        grid-template-rows: repeat(24, 8px);
    }

    .pixel {
        width: 8px;
        height: 8px;
        background: transparent;
    }

    .on {
        background: #222;
    }
</style>
</head>

<body>

<div id="bat"></div>

<script>

const frame0 = [
  "000000000100000000",
  "000000001110000000",
  "000000111111100000",
  "000001111111110000",
  "000111100110011110",
  "001111100110011111",
  "011111111111111111",
  "000011111111111000",
  "000001111111110000"
];

const frame1 = [
  "000000000000000000",
  "000000001110000000",
  "000000111111100000",
  "000011111111111000",
  "000111111111111110",
  "001111100110011111",
  "011111111111111111",
  "001111111111111110",
  "000111111111111100"
];

const frame2 = [
  "000000000000000000",
  "000000001110000000",
  "000000011111000000",
  "000000111111100000",
  "000001111111110000",
  "000011110110111100",
  "000111111111111110",
  "001111111111111111",
  "011111100110011111"
];

const frame3 = [
  "000000000000000000",
  "000000001110000000",
  "000000011111000000",
  "000000111111100000",
  "000011111111111000",
  "000111111111111110",
  "001111100110011111",
  "011111111111111111",
  "001111111111111110"
];

const frame4 = [
  "000000000100000000",
  "000000001110000000",
  "000000111111100000",
  "000001111111110000",
  "000111100110011110",
  "001111100110011111",
  "011111111111111111",
  "000011111111111000",
  "000001111111110000"
];

let frameAtual = 0;

function desenhar(frame) {

    const bat = document.getElementById("bat");

    bat.innerHTML = "";

    for (let linha of frame) {

        for (let pixel of linha) {

            const elemento = document.createElement("div");

            elemento.classList.add("pixel");

            if (pixel === "1") {
                elemento.classList.add("on");
            }

            bat.appendChild(elemento);
        }
    }
}

function animar() {

    if (frameAtual === 0) {
        desenhar(frame1);
        frameAtual = 1;
    } else {
        desenhar(frame2);
        frameAtual = 0;
    }
}

desenhar(frame1);

setInterval(animar, 400);

</script>

</body>
</html>
