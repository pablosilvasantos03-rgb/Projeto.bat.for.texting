<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Morcego Pixelado</title>

<style>
    body {
        margin: 0;
        background: #aaa;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #bat {
        display: grid;
        grid-template-columns: repeat(32, 8px);
        grid-template-rows: repeat(24, 8px);
    }

    .pixel {
        width: 8px;
        height: 8px;
        background: transparent;
    }

    .on {
        background: #222;
    }
</style>
</head>

<body>

<div id="bat"></div>

<script>

const frame1 = [
"00000000000000000000000000000000",
"00000000000000000000000000000000",
"00000000000000000000000000000000",
"00000000000000000011000000000000",
"00000000000000001111110000000000",
"00000000000000011111111000000000",
"00000000000000111111111100000000",
"00000000110001111111111111001100",
"00000011111111111111111111111100",
"00000111111111111111111111111110",
"00001111111111111111111111111111",
"00011111111111111111111111111111",
"00111111111111111111111111111111",
"01111111111111111111111111111110",
"11111111111111111111111111111100",
"01111111111111111111111111111000",
"00111111111111111111111111110000",
"00011111111111111111111111100000",
"00001111111111111111111111000000",
"00000111111111111111111110000000",
"00000011111100000011111100000000",
"00000001111000000001111000000000",
"00000000110000000000110000000000",
"00000000000000000000000000000000"
];

const frame2 = [
"00000000000000000000000000000000",
"00000000000000000000000000000000",
"00000000000000000000000000000000",
"00000000000000000011000000000000",
"00000000000000001111110000000000",
"00000000000000111111111100000000",
"00000000000011111111111111000000",
"00000000001111111111111111110000",
"00000000111111111111111111111100",
"00000011111111111111111111111110",
"00000111111111111111111111111111",
"00001111111111111111111111111111",
"00011111111111111111111111111111",
"00111111111111111111111111111110",
"01111111111111111111111111111100",
"00111111111111111111111111111000",
"00011111111111111111111111110000",
"00001111111111111111111111100000",
"00000111111111111111111111000000",
"00000011111111111111111110000000",
"00000001111100000011111100000000",
"00000000111000000001111000000000",
"00000000010000000000110000000000",
"00000000000000000000000000000000"
];

let frameAtual = 0;

function desenhar(frame) {

    const bat = document.getElementById("bat");

    bat.innerHTML = "";

    for (let linha of frame) {

        for (let pixel of linha) {

            const elemento = document.createElement("div");

            elemento.classList.add("pixel");

            if (pixel === "1") {
                elemento.classList.add("on");
            }

            bat.appendChild(elemento);
        }
    }
}

function animar() {

    if (frameAtual === 0) {
        desenhar(frame1);
        frameAtual = 1;
    } else {
        desenhar(frame2);
        frameAtual = 0;
    }
}

desenhar(frame1);

setInterval(animar, 400);

</script>

</body>
</html>
